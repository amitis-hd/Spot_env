# The default lab (approved mockup). Coordinates are [x, y]; y=0 is the north wall.
#
#       x=0              x=1                 x=2                    x=3
# y=0  counter_1        counter_2           counter_3              .
#      drawer_1 LOCKED  drawer_2 OPEN       pen_1, key_drawer1,
#      cabinet_1 HIGH   (binder_1 sticks    mug_1; shelf_1 HIGH
#                        out; auto-locks)
#                       cabinet_2 HIGH (key_door inside)
# y=1  .                SPOT facing N       .                      stool_1
# y=2  door_1 (W wall)  alex                table_1: lamp_1,       chair_1
#      closed                               light_button, book_1
# y=3  .                door_2 (S wall)     .                      dock_1
#                       OPEN
name: default_lab
grid: {width: 4, height: 4}
config: {verbose_failures: false, hide_key_targets: false}
goal: {type: close_lab, container_kinds: [drawer]}
robot: {id: spot, cell: [1, 1], facing: N}
objects:
  - {id: counter_1, type: Counter, cell: [0, 0]}
  - {id: drawer_1, type: Drawer, cell: [0, 0], lock_type: key, locked: true}
  - {id: cabinet_1, type: Cabinet, cell: [0, 0], level: high}

  - {id: counter_2, type: Counter, cell: [1, 0]}
  - {id: drawer_2, type: Drawer, cell: [1, 0], lock_type: key, auto_lock: true, is_open: true}
  - {id: binder_1, type: Binder, inside: drawer_2, protruding: true}
  - {id: cabinet_2, type: Cabinet, cell: [1, 0], level: high}
  - {id: key_door, type: Key, inside: cabinet_2, opens: [door_1, door_2]}

  - {id: counter_3, type: Counter, cell: [2, 0]}
  - {id: pen_1, type: Pen, on: counter_3}
  - {id: key_drawer1, type: Key, on: counter_3, opens: [drawer_1, drawer_2]}
  - {id: mug_1, type: Mug, on: counter_3}
  - {id: shelf_1, type: Shelf, cell: [2, 0], level: high}

  - {id: table_1, type: Table, cell: [2, 2]}
  - {id: lamp_1, type: Lamp, on: table_1}
  - {id: light_button, type: LightButton, on: table_1, controls: [lamp_1]}
  - {id: book_1, type: Book, on: table_1}

  - {id: stool_1, type: Stool, cell: [3, 1]}
  - {id: chair_1, type: Chair, cell: [3, 2]}
  - {id: alex, type: Person, cell: [1, 2], policy: {type: compliant}}
  - {id: dock_1, type: Dock, cell: [3, 3]}

  - {id: door_1, type: Door, cell: [0, 2], side: W}
  - {id: door_2, type: Door, cell: [1, 3], side: S, is_open: true}
